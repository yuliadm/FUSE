name: fuse-kaolin

services:
  kaolin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "${HOST_UID:-1000}"
        GROUP_ID: "${HOST_GID:-1000}"
        KAOLIN_VERSION: "0.18.0"

    image: fuse-kaolin:torch2.5.1-cu124
    container_name: fuse-kaolin

    # The runtime identity must match the identity created during the build.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    gpus: all
    shm_size: "8gb"
    init: true

    ports:
      - "127.0.0.1:${KAOLIN_PORT:-8891}:8891"
      - "127.0.0.1:${FUSE_APP_PORT:-8501}:8501"

    volumes:
      # compose.yaml is expected at FUSE/containers/kaolin/compose.yaml.
      # All host directories must exist before the container starts.
      - type: bind
        source: "${FUSE_NOTEBOOKS_DIR:-../../notebooks}"
        target: /workspace/notebooks
        bind:
          create_host_path: false

      - type: bind
        source: "${FUSE_DATA_DIR:-../../data}"
        target: /workspace/data
        bind:
          create_host_path: false

      - type: bind
        source: "${FUSE_APP_DIR:-../../app}"
        target: /workspace/app
        bind:
          create_host_path: false

      - type: bind
        source: "${FUSE_KAOLIN_CACHE_DIR:-./cache}"
        target: /workspace/.cache
        bind:
          create_host_path: false

    environment:
      HOME: /home/fuse
      XDG_CACHE_HOME: /workspace/.cache/xdg
      TORCH_HOME: /workspace/.cache/torch
      MPLCONFIGDIR: /workspace/.cache/matplotlib
      JUPYTER_CONFIG_DIR: /workspace/.cache/jupyter
      IPYTHONDIR: /workspace/.cache/ipython
      PYTHONPATH: /workspace
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    working_dir: /workspace

    command:
      - python
      - -m
      - jupyterlab
      - --ip=0.0.0.0
      - --port=8891
      - --no-browser
      - --ServerApp.root_dir=/workspace
      - --IdentityProvider.token=
      - --ServerApp.password=
      - --LabApp.extension_manager=readonly

    restart: unless-stopped
