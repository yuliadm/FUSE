name: fuse-manufacturing

services:
  manufacturing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "${HOST_UID:-1000}"
        GROUP_ID: "${HOST_GID:-1000}"
        FREECAD_VERSION: "1.1.3"

    image: fuse-manufacturing:freecad-1.1.3
    container_name: fuse-manufacturing

    # The runtime identity must match the identity created during the build.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    shm_size: "4gb"
    init: true

    ports:
      - "127.0.0.1:${MANUFACTURING_PORT:-8893}:8893"

    volumes:
      # compose.yaml is expected at FUSE/containers/manufacturing/compose.yaml.
      # All host directories must already exist.
      - type: bind
        source: "${FUSE_NOTEBOOKS_DIR:-../../notebooks}"
        target: /workspace/notebooks
        bind:
          create_host_path: false

      - type: bind
        source: "${FUSE_DATA_DIR:-../../data}"
        target: /workspace/data
        bind:
          create_host_path: false

      - type: bind
        source: "${FUSE_MANUFACTURING_CACHE_DIR:-./cache}"
        target: /workspace/.cache
        bind:
          create_host_path: false

    environment:
      HOME: /home/fuse
      XDG_CACHE_HOME: /workspace/.cache/xdg
      MPLCONFIGDIR: /workspace/.cache/matplotlib
      JUPYTER_CONFIG_DIR: /workspace/.cache/jupyter
      IPYTHONDIR: /workspace/.cache/ipython
      QT_QPA_PLATFORM: offscreen
      FREECAD_USER_HOME: /workspace/.cache/freecad
      FUSE_FREECAD_CMD: /opt/freecad/AppRun
      FUSE_DATA_ROOT: /workspace/data
      PYTHONPATH: /opt/fuse-manufacturing:/workspace
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    working_dir: /workspace

    command:
      - python
      - -m
      - jupyterlab
      - --ip=0.0.0.0
      - --port=8893
      - --no-browser
      - --ServerApp.root_dir=/workspace
      - --IdentityProvider.token=
      - --ServerApp.password=
      - --LabApp.extension_manager=readonly

    restart: unless-stopped
