services:
  hunyuan:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "${HOST_UID:-1000}"
        GROUP_ID: "${HOST_GID:-1000}"

    image: fuse-hunyuan3d-shape:2.1
    container_name: fuse-hunyuan

    # This must match the UID/GID used to create `fuse` during the build.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    userns_mode: "keep-id"

    gpus: all
    shm_size: "8gb"
    init: true

    ports:
      - "127.0.0.1:${HUNYUAN_PORT:-8892}:8892"

    volumes:
      # compose.yaml is expected at FUSE/containers/hunyuan/compose.yaml.
      # All three host directories must already exist.
      - type: bind
        source: "${FUSE_NOTEBOOKS_DIR:-../../notebooks}"
        target: /workspace/notebooks
        bind:
          create_host_path: false

      - type: bind
        source: "${FUSE_DATA_DIR:-../../data}"
        target: /workspace/data
        bind:
          create_host_path: false

      - type: bind
        source: "${FUSE_HUNYUAN_CACHE_DIR:-./cache}"
        target: /workspace/.cache
        bind:
          create_host_path: false

    environment:
      HOME: /home/fuse
      XDG_CACHE_HOME: /workspace/.cache/xdg
      HF_HOME: /workspace/.cache/huggingface
      TORCH_HOME: /workspace/.cache/torch
      U2NET_HOME: /workspace/.cache/rembg
      PYTHONPATH: /opt/Hunyuan3D-2.1/hy3dshape:/workspace
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NUMBA_CACHE_DIR: /workspace/.cache/numba

    working_dir: /workspace

    command:
      - python
      - -m
      - jupyterlab
      - --ip=0.0.0.0
      - --port=8892
      - --no-browser
      - --ServerApp.root_dir=/workspace
      - --IdentityProvider.token=
      - --ServerApp.password=
      - --LabApp.extension_manager=readonly

    restart: unless-stopped
